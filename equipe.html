<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Equipe · figoo</title>
  <!-- Favicon Canvas Padrão Figoo -->
  <script>
  (function(){
    var c=document.createElement('canvas'); c.width=c.height=64;
    var ctx=c.getContext('2d');
    ctx.fillStyle='#2D5016'; ctx.fillRect(0,0,64,64);
    ctx.fillStyle='#C0DD97';
    ctx.beginPath(); ctx.moveTo(32,56); ctx.bezierCurveTo(32,56,6,42,10,12); ctx.bezierCurveTo(22,4,32,32,32,56); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#5EAD24'; ctx.globalAlpha=0.88;
    ctx.beginPath(); ctx.moveTo(32,56); ctx.bezierCurveTo(32,56,58,42,54,12); ctx.bezierCurveTo(42,4,32,32,32,56); ctx.closePath(); ctx.fill();
    ctx.globalAlpha=1; ctx.fillStyle='#8B6914';
    ctx.beginPath(); ctx.arc(32,61,5,0,Math.PI*2); ctx.fill();
    var l=document.querySelector("link[rel~='icon']");
    if(!l){l=document.createElement('link');l.rel='icon';document.head.appendChild(l);}
    l.href=c.toDataURL();
  })();
  </script>

  <link rel="stylesheet" href="figoo-base.css?v=20260901_v1" />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="figoo-theme.js?v=20260901_v1"></script>
  <script src="figoo-fontsize.js?v=20260826_v1"></script>
  <script src="figoo-auth.js?v=20260901_v1"></script>
  <script src="figoo-ui.js?v=20260901_v1"></script>
  <style>
    :root {
      --primary:#2D5016; --primary-hover:#234010; --secondary:#5EAD24;
      --bg:#F6F7F9; --white:#FFFFFF; --text:#1B1F1D; --text2:#4A544E;
      --border:#E8EAED; --radius:12px; --c-danger:#B4291B;
      --fs-xs:0.75rem; --fs-sm:0.84rem; --fs-md:0.92rem; --fs-lg:1.1rem; --fs-xl:1.35rem;
    }
    body {
      font-family:Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column;
    }
    
    .page-wrap { max-width:1200px; width:100%; margin:0 auto; padding:8px 24px 60px; flex:1; display:flex; flex-direction:column; gap:14px; }
    @media (min-width: 1400px) { .page-wrap { max-width: 1440px; } }
    @media (min-width: 1600px) { .page-wrap { max-width: 1600px; } }
    
    .header-bar {
      background:var(--white); border:.5px solid var(--border); border-radius:12px;
      padding:12px 18px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
      box-shadow:0 1px 3px rgba(0,0,0,.03);
    }
    .header-left { display:flex; align-items:center; gap:12px; }
    .header-title-group h1 { font-size:var(--fs-xl); font-weight:700; color:var(--text); display:flex; align-items:center; gap:8px; }
    .header-title-group p { font-size:var(--fs-xs); color:var(--text2); margin-top:2px; }

    .controls-bar {
      background:var(--white); border:.5px solid var(--border); border-radius:var(--radius);
      padding:12px 16px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
    }
    .search-inp {
      flex:1; min-width:240px; border:.5px solid var(--border); border-radius:8px;
      padding:8px 12px; font-size:var(--fs-sm); font-family:inherit; outline:none; background:var(--bg); transition:border-color .15s;
    }
    .search-inp:focus { border-color:var(--secondary); background:var(--white); }
    .filter-chips { display:flex; gap:6px; }
    .fchip {
      padding:5px 12px; border-radius:99px; font-size:var(--fs-xs); font-weight:600;
      cursor:pointer; border:.5px solid var(--border); background:var(--bg); color:var(--text2); transition:border-color .15s, color .15s, background .15s;
    }
    .fchip:hover { border-color:var(--secondary); color:var(--text); }
    .fchip.active { background:var(--primary); color:#fff; border-color:var(--primary); }

    .view-toggle { display:inline-flex; background:var(--white); border:.5px solid var(--border); border-radius:99px; overflow:hidden; }
    .view-toggle .vt { padding:8px 11px; background:none; border:none; cursor:pointer; color:var(--text2); display:inline-flex; align-items:center; }
    .view-toggle .vt:first-child { border-right:.5px solid var(--border); }
    .view-toggle .vt.on { background:var(--primary); color:#fff; }
    .view-toggle .vt:not(.on):hover { background:var(--bg); color:var(--text); }
    .table-wrap { overflow-x:auto; border:.5px solid var(--border); border-radius:12px; background:var(--white); -webkit-overflow-scrolling:touch; }
    .eq-table { width:100%; border-collapse:collapse; font-size:var(--fs-sm); min-width:680px; }
    .eq-table th { text-align:left; font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text2); padding:10px 14px; border-bottom:.5px solid var(--border); white-space:nowrap; }
    .eq-table td { padding:10px 14px; border-bottom:.5px solid var(--border); color:var(--text); vertical-align:middle; }
    .eq-table tbody tr:last-child td { border-bottom:none; }

    /* Lista de Integrantes */
    .eq-grid { display:flex; flex-direction:column; gap:8px; }
    .eq-card {
      background:var(--white); border:.5px solid var(--border); border-radius:var(--radius);
      padding:12px 16px; display:flex; align-items:center; gap:16px; position:relative;
      box-shadow:0 2px 6px rgba(0,0,0,.02); transition:border-color .15s; flex-wrap:wrap;
    }
    .eq-card:hover { border-color:var(--secondary); }
    .eq-head { display:flex; align-items:center; gap:12px; min-width:220px; }
    .eq-avatar {
      width:40px; height:40px; border-radius:50%; background:color-mix(in srgb, var(--secondary) 15%, var(--white));
      color:var(--primary); font-weight:700; font-size:1rem; display:flex; align-items:center; justify-content:center;
      flex-shrink:0; border:1px solid color-mix(in srgb, var(--secondary) 30%, var(--white));
    }
    .eq-info { flex:1; min-width:0; }
    .eq-name { font-weight:700; font-size:var(--fs-md); color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .eq-short { font-size:var(--fs-xs); font-weight:600; color:var(--secondary); }
    .eq-role { font-size:var(--fs-xs); color:var(--text2); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    .eq-details { display:flex; align-items:center; gap:16px; font-size:var(--fs-sm); color:var(--text2); flex:1; min-width:200px; flex-wrap:wrap; }
    .eq-row { display:flex; align-items:center; gap:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    .eq-foot { display:flex; align-items:center; gap:12px; justify-content:flex-end; min-width:200px; margin-left:auto; }
    .st-tag { font-size:0.68rem; font-weight:700; padding:2px 8px; border-radius:99px; }
    .st-tag.ativo { background:color-mix(in srgb, var(--secondary) 15%, var(--white)); color:var(--primary); }
    .st-tag.inativo { background:rgba(127,127,127,.12); color:var(--text2); }

    /* Contadores de relacionados (pendências/ações/reuniões) no card */
    .eq-stats { display:flex; align-items:center; gap:12px; flex-wrap:wrap; width:100%; padding-top:8px; border-top:.5px solid var(--border); font-size:var(--fs-xs); color:var(--text2); }
    .eq-stats .es { display:inline-flex; align-items:center; gap:4px; }
    .eq-stats .es b { color:var(--text); font-weight:700; }
    .eq-stats .es-crit { color:var(--c-danger); font-weight:700; }

    /* Ficha "relacionados" do colaborador */
    .colab-stat-row { display:flex; gap:10px; flex-wrap:wrap; }
    .colab-stat { flex:1; min-width:100px; background:var(--bg); border:.5px solid var(--border); border-radius:10px; padding:10px 12px; text-align:center; }
    .colab-stat b { display:block; font-size:1.2rem; color:var(--primary); }
    .colab-stat span { font-size:var(--fs-xs); color:var(--text2); }
    .tl-item { display:flex; align-items:center; gap:11px; padding:9px 0; border-bottom:.5px solid var(--border); cursor:pointer; }
    .tl-item:last-child { border-bottom:none; }
    .tl-item:hover .tl-go { color:var(--secondary); }
    .tl-ic { width:26px; height:26px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:.85rem; }
    .tl-ic.reu { background:color-mix(in srgb,var(--secondary) 15%,var(--white)); }
    .tl-ic.pend { background:color-mix(in srgb,var(--primary) 15%,var(--white)); }
    .tl-ic.acao { background:rgba(180,41,27,.1); }
    .tl-body { flex:1; min-width:0; }
    .tl-top { display:flex; align-items:center; gap:6px; font-size:var(--fs-sm); color:var(--text); }
    .tl-sub { font-size:var(--fs-xs); color:var(--text2); margin-top:1px; }
    .tl-badge { font-size:0.65rem; font-weight:700; padding:1px 8px; border-radius:99px; white-space:nowrap; background:rgba(127,127,127,.12); color:var(--text2); }
    .tl-go { color:var(--text2); flex-shrink:0; }

    .wa-btn {
      display:inline-flex; align-items:center; gap:4px; padding:4px 8px; border-radius:6px;
      background:#25D366; color:#fff; font-size:var(--fs-xs); font-weight:600; text-decoration:none; transition:opacity .15s;
    }
    .wa-btn:hover { opacity:.9; }

    /* Modal */
    .modal-ov { position:fixed; inset:0; background:rgba(0,0,0,0.45); backdrop-filter:blur(3px); z-index:9990; display:flex; align-items:center; justify-content:center; padding:16px; }
    .modal-ov.hidden { display:none!important; }
    .modal-card { background:var(--white); border-radius:14px; padding:22px 24px; max-width:min(560px,94vw); width:100%; border:.5px solid var(--border); box-shadow:0 16px 48px rgba(0,0,0,.18); display:flex; flex-direction:column; gap:14px; }
    .modal-card h2 { font-size:var(--fs-lg); font-weight:700; margin:0; display:flex; align-items:center; justify-content:space-between; color:var(--text); }
    
    .ffield { display:flex; flex-direction:column; gap:4px; }
    .ffield label { font-size:var(--fs-xs); font-weight:600; color:var(--text2); }
    .finput, .fselect, .ftextarea {
      width:100%; border:.5px solid var(--border); border-radius:8px; padding:8px 11px;
      font-size:var(--fs-sm); font-family:inherit; color:var(--text); outline:none; background:var(--white); transition:border-color .15s;
    }
    .ftextarea { min-height:60px; resize:vertical; }
    .finput:focus-visible, .fselect:focus-visible, .ftextarea:focus-visible { border-color:var(--secondary); }

    .toast {
      position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
      background:var(--text); color:#fff; padding:10px 20px; border-radius:10px;
      font-size:var(--fs-sm); font-weight:500; opacity:0; transition:opacity .25s, transform .25s;
      pointer-events:none; z-index:9999; display:flex; align-items:center; gap:8px;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div class="topbar" id="topbar" style="display:none"></div>

<div class="page-wrap" id="pageWrap" style="display:none">
  <!-- CABEÇALHO DA PÁGINA -->
  <div class="header-bar">
    <div class="header-left">
      <div class="header-title-group">
        <h1>👥 Equipe & Colaboradores</h1>
        <p>Cadastro oficial dos integrantes da equipe para relacionamento automático na Weekly e nas Reuniões</p>
      </div>
    </div>
    <button class="tbtn success" onclick="openEquipeModal()">+ Novo Integrante</button>
  </div>

  <!-- BARRA DE BUSCA E FILTROS -->
  <div class="controls-bar">
    <input type="text" id="eq-search" class="search-inp" aria-label="Buscar colaborador" placeholder="Buscar por nome, nome curto/Weekly, cargo ou WhatsApp..." oninput="renderEquipeList()" />
    <div class="filter-chips">
      <button class="fchip active" id="flt-todos" onclick="setFilter('todos')">Todos (<span id="cnt-todos">0</span>)</button>
      <button class="fchip" id="flt-ativo" onclick="setFilter('ativo')">Ativos (<span id="cnt-ativo">0</span>)</button>
      <button class="fchip" id="flt-inativo" onclick="setFilter('inativo')">Inativos (<span id="cnt-inativo">0</span>)</button>
    </div>
    <div class="view-toggle">
      <button class="vt" data-v="cards" onclick="setEqView('cards')" title="Ver em cartões" aria-label="Ver em cartões"><svg class="ci" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
      <button class="vt" data-v="list" onclick="setEqView('list')" title="Ver em lista" aria-label="Ver em lista"><svg class="ci" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
    </div>
  </div>

  <!-- GRID/LISTA DE INTEGRANTES -->
  <div class="eq-grid" id="eq-grid-container">
    <!-- Renderizado dinamicamente -->
  </div>
</div>

<!-- MODAL DE CADASTRO / EDIÇÃO DE INTEGRANTE -->
<div class="modal-ov hidden" id="equipeModal">
  <div class="modal-card">
    <h2>
      <span id="modal-title">👤 Cadastrar Integrante</span>
      <button type="button" class="tbtn" onclick="closeEquipeModal()" aria-label="Fechar">✕</button>
    </h2>

    <form onsubmit="handleSaveMember(event)" style="display:flex;flex-direction:column;gap:12px">
      <input type="hidden" id="member-id" />

      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <div class="ffield" style="flex:2;min-width:180px">
          <label for="member-nome">Nome Completo *</label>
          <input type="text" id="member-nome" class="finput" placeholder="Ex: Emanuel Alexandre Silva" required autocomplete="name" oninput="autoFillShortName(this.value)" />
        </div>
        <div class="ffield" style="flex:1;min-width:130px">
          <label for="member-short">Nome Curto / Weekly *</label>
          <input type="text" id="member-short" class="finput" placeholder="Ex: Emanuel" required title="Nome de exibição compacto nas reuniões e na Weekly" />
        </div>
      </div>

      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <div class="ffield" style="flex:1;min-width:160px">
          <label for="member-cargo">Cargo / Função</label>
          <input type="text" id="member-cargo" class="finput" placeholder="Ex: Gestor de Projetos / Consultor" />
        </div>
        <div class="ffield" style="flex:1;min-width:140px">
          <label for="member-wa">WhatsApp / Telefone</label>
          <input type="tel" inputmode="tel" id="member-wa" class="finput" placeholder="Ex: 48999999999" autocomplete="tel" />
        </div>
      </div>

      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <div class="ffield" style="flex:2;min-width:180px">
          <label for="member-email">E-mail Corporativo</label>
          <input type="email" id="member-email" class="finput" placeholder="emanuel@empresa.com.br" autocomplete="email" spellcheck="false" />
        </div>
        <div class="ffield" style="flex:1;min-width:120px">
          <label for="member-status">Status na Equipe</label>
          <select id="member-status" class="fselect">
            <option value="ativo">✅ Ativo</option>
            <option value="inativo">⏸️ Inativo</option>
          </select>
        </div>
      </div>

      <div class="ffield">
        <label for="member-notas">Dados Gerais / Observações</label>
        <textarea id="member-notas" class="ftextarea" placeholder="Anotações internas sobre o colaborador, setor, horários de atendimento..."></textarea>
      </div>

      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:4px">
        <button type="button" class="tbtn" onclick="closeEquipeModal()">Cancelar</button>
        <button type="submit" class="tbtn success">+ Salvar Integrante</button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL: FICHA DE RELACIONADOS DO COLABORADOR -->
<div class="modal-ov hidden" id="colabFichaModal">
  <div class="modal-card" style="max-width:min(620px,94vw);max-height:86vh;overflow-y:auto">
    <h2>
      <span id="colab-ficha-title">👤 Relacionados</span>
      <button type="button" class="tbtn" onclick="closeColabFicha()" aria-label="Fechar">✕</button>
    </h2>
    <div class="colab-stat-row" id="colab-ficha-stats"></div>
    <div id="colab-ficha-timeline"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  'use strict';

  function $i(id){ return document.getElementById(id); }
  function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function toast(msg){
    var t = $i('toast');
    t.innerHTML = '<span>' + msg + '</span>';
    t.classList.add('show');
    clearTimeout(t._t);
    t._t = setTimeout(function(){ t.classList.remove('show'); }, 2500);
  }

  var userEmail = '', emailKey = '', localMode = false;
  var equipeList = [];
  var activeFilter = 'todos';
  var eqViewMode = (function(){ try{ return localStorage.getItem('eq_view')==='list'?'list':'cards'; }catch(e){ return 'cards'; } })();
  var eqTableSort = { key: null, dir: 1 };
  function eqSortValue(col, key){
    if(key === 'nomeCurto') return col.nomeCurto || col.nome.split(' ')[0] || col.nome;
    if(key === 'status') return col.status !== 'inativo' ? 'ativo' : 'inativo';
    return col[key] || '';
  }
  window.setEqSort = function(key){
    figooSortToggle(eqTableSort, key);
    window.renderEquipeList();
  };

  // ── Dados de outros módulos (só leitura) p/ a ficha "relacionados" de cada colaborador ──
  var pendList = [], acoesList = [], reunioesList = [], weeklyMap = {};
  function norm(s){ return (typeof figooNormName==='function' ? figooNormName : function(x){ return (x||'').trim().toLowerCase(); })(s); }
  function colabMatch(col, name){
    if(!name) return false;
    var n = norm(name);
    return n === norm(col.nome) || (!!col.nomeCurto && n === norm(col.nomeCurto));
  }

  async function loadRelatedData(){
    var results = await Promise.all([
      fbGetEnc('pendencias/' + emailKey + '/items', 12000).catch(function(){ return null; }),
      fbGetEnc('acoes_programadas/' + emailKey + '/items', 12000).catch(function(){ return null; }),
      fbGet('reunioes/' + emailKey + '/m', 12000).catch(function(){ return null; }),
      fbGet('weekly/' + emailKey + '/w', 12000).catch(function(){ return null; })
    ]);
    var rawPend = results[0], rawAcoes = results[1], rawReu = results[2], rawWeekly = results[3];

    pendList = rawPend == null ? [] : (Array.isArray(rawPend) ? rawPend : Object.values(rawPend));
    acoesList = rawAcoes == null ? [] : (Array.isArray(rawAcoes) ? rawAcoes : Object.values(rawAcoes));

    reunioesList = [];
    if(rawReu && typeof rawReu === 'object'){
      for(var mid in rawReu){
        if(mid.indexOf('__') === 0) continue;
        try{ var m = await decData(rawReu[mid]); if(m) reunioesList.push(m); }catch(e){}
      }
    }

    weeklyMap = {};
    if(rawWeekly && typeof rawWeekly === 'object'){
      for(var wid in rawWeekly){
        if(wid.indexOf('__') === 0) continue;
        try{ var w = await decData(rawWeekly[wid]); if(w) weeklyMap[wid] = w; }catch(e){}
      }
    }
  }

  function colabRollup(col){
    var today = new Date().toISOString().slice(0,10);
    var pends = pendList.filter(function(p){ return p && colabMatch(col, p.colaborador); });
    var abertasArr = pends.filter(function(p){ return p.status === 'pendente'; });
    var atrasadas = abertasArr.filter(function(p){ return p.dueDate && p.dueDate < today; }).length;
    var resolvidas = pends.filter(function(p){ return p.status === 'feita'; }).length;
    var acoes = acoesList.filter(function(a){ return a && colabMatch(col, a.responsavel); });
    var acoesAbertas = acoes.filter(function(a){ return a.status !== 'concluida' && a.status !== 'cancelada'; }).length;
    var reus = reunioesList.filter(function(m){
      return m && (colabMatch(col, m.responsavel) || (m.participantes||[]).some(function(p){ return p && colabMatch(col, p.nome); }));
    });
    var weeklyN = 0;
    Object.values(weeklyMap).forEach(function(week){
      (week.pendencias||[]).forEach(function(p){ if(p && colabMatch(col, p.who)) weeklyN++; });
    });
    return { pends:pends, abertas:abertasArr.length, atrasadas:atrasadas, resolvidas:resolvidas,
      acoes:acoes, acoesAbertas:acoesAbertas, reus:reus, reunioesN:reus.length, weeklyN:weeklyN };
  }

  function buildColabTimeline(col){
    var r = colabRollup(col), ev = [];
    r.pends.forEach(function(p){ ev.push({ ts:(p.status==='feita'&&p.doneAt)?p.doneAt:(p.createdAt||0), kind:'pend', item:p }); });
    r.acoes.forEach(function(a){ ev.push({ ts:(a.data?new Date(a.data+'T12:00:00').getTime():(a.updatedAt||a.createdAt||0)), kind:'acao', item:a }); });
    r.reus.forEach(function(m){ if(m.data) ev.push({ ts:new Date(m.data+'T12:00:00').getTime(), kind:'reuniao', item:m }); });
    ev.sort(function(a,b){ return b.ts - a.ts; });
    return ev;
  }

  // ── Ficha "relacionados" do colaborador ──────────────────
  function _e(){ return encodeURIComponent(userEmail); }
  function dBR(iso){ if(!iso) return '—'; var p=iso.split('-'); return p.length===3 ? (p[2]+'/'+p[1]) : iso; }
  function plainText(html){ var d=document.createElement('div'); d.innerHTML=html||''; return d.textContent||''; }
  window.abrirPendColab = function(id){ window.location.href = 'pendencias.html?e=' + _e() + '&p=' + encodeURIComponent(id); };
  window.abrirAcaoColab = function(id){ window.location.href = 'acoes-programadas.html?e=' + _e() + '&a=' + encodeURIComponent(id); };
  window.abrirReuniaoColab = function(id){ window.location.href = 'reunioes.html?e=' + _e() + '&m=' + encodeURIComponent(id); };

  window.openColabFicha = function(id){
    var col = equipeList.find(function(c){ return c.id === id; });
    if(!col) return;
    var r = colabRollup(col), tl = buildColabTimeline(col);
    $i('colab-ficha-title').textContent = '👤 Relacionados — ' + col.nome;
    $i('colab-ficha-stats').innerHTML =
      '<div class="colab-stat"><b>' + r.abertas + '</b><span>Pendências abertas' + (r.atrasadas ? ' (' + r.atrasadas + ' atrasada' + (r.atrasadas>1?'s':'') + ')' : '') + '</span></div>' +
      '<div class="colab-stat"><b>' + r.resolvidas + '</b><span>Pendências resolvidas</span></div>' +
      '<div class="colab-stat"><b>' + r.acoesAbertas + '</b><span>Ações em aberto</span></div>' +
      '<div class="colab-stat"><b>' + r.reunioesN + '</b><span>Reuniões</span></div>' +
      (r.weeklyN ? '<div class="colab-stat"><b>' + r.weeklyN + '</b><span>Menções na Weekly</span></div>' : '');

    $i('colab-ficha-timeline').innerHTML = tl.length ? tl.map(function(x){
      if(x.kind === 'pend'){
        var p = x.item, st = p.status==='feita' ? 'Resolvida' : (p.dueDate && p.dueDate<new Date().toISOString().slice(0,10) ? 'Atrasada' : 'Aberta');
        return '<div class="tl-item" onclick="abrirPendColab(\'' + p.id + '\')" title="Abrir a pendência">' +
          '<span class="tl-ic pend">📋</span><div class="tl-body">' +
          '<div class="tl-top">#' + String(p.ticketNum||0).padStart(4,'0') + ' ' + esc(plainText(p.desc).slice(0,70) || '—') + ' <span class="tl-badge">' + st + '</span></div>' +
          '<div class="tl-sub">' + (p.status==='feita' ? 'Resolvida em ' : 'Criada em ') + dBR(new Date(p.status==='feita'&&p.doneAt?p.doneAt:p.createdAt).toISOString().slice(0,10)) + '</div>' +
          '</div><span class="tl-go">›</span></div>';
      }
      if(x.kind === 'acao'){
        var a = x.item;
        return '<div class="tl-item" onclick="abrirAcaoColab(\'' + a.id + '\')" title="Abrir a ação programada">' +
          '<span class="tl-ic acao">⚡</span><div class="tl-body">' +
          '<div class="tl-top">' + esc(a.titulo || 'Ação programada') + ' <span class="tl-badge">' + esc(a.status||'programada') + '</span></div>' +
          '<div class="tl-sub">' + (a.data ? dBR(a.data) : 'sem data') + '</div>' +
          '</div><span class="tl-go">›</span></div>';
      }
      var m = x.item, np = (m.participantes||[]).length;
      return '<div class="tl-item" onclick="abrirReuniaoColab(\'' + m.id + '\')" title="Abrir a reunião">' +
        '<span class="tl-ic reu">🤝</span><div class="tl-body">' +
        '<div class="tl-top">' + esc(m.cliente || 'Reunião') + ' <span class="tl-badge">' + esc(m.status||'agendada') + '</span></div>' +
        '<div class="tl-sub">' + dBR(m.data) + (np ? ' · ' + np + ' participante' + (np>1?'s':'') : '') + '</div>' +
        '</div><span class="tl-go">›</span></div>';
    }).join('') : '<p style="font-size:var(--fs-sm);color:var(--text2);padding:8px 0">Nenhuma pendência, ação ou reunião relacionada a este colaborador ainda.</p>';

    $i('colabFichaModal').classList.remove('hidden');
  };
  window.closeColabFicha = function(){ $i('colabFichaModal').classList.add('hidden'); };

  function getInitials(name){
    if(!name) return 'EQ';
    var parts = name.trim().split(/\s+/);
    if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
  }

  function formatWaLink(wa){
    if(!wa) return null;
    var clean = wa.replace(/\D/g,'');
    if(!clean) return null;
    if(clean.length <= 11) clean = '55' + clean;
    return 'https://wa.me/' + clean;
  }

  async function loadEquipeData(){
    try {
      var raw = await fbGetEnc('colaboradores/' + emailKey + '/items', 10000);
      equipeList = raw == null ? [] : (Array.isArray(raw) ? raw : Object.values(raw));
      equipeList = equipeList.filter(function(c){ return c && typeof c === 'object' && (c.nome || c.nomeCurto); });
    } catch(e){
      equipeList = [];
    }

    if(equipeList.length === 0){
      var defaults = [
        { nome: 'Emanuel Alexandre', nomeCurto: 'Emanuel', cargo: 'Gestor de Projetos', status: 'ativo' },
        { nome: 'João Pedro Silva', nomeCurto: 'João', cargo: 'Consultor Técnico', status: 'ativo' },
        { nome: 'Maria Eduarda', nomeCurto: 'Maria', cargo: 'Analista de Negócios', status: 'ativo' },
        { nome: 'Ana Clara', nomeCurto: 'Ana', cargo: 'Atendimento', status: 'ativo' },
        { nome: 'Carlos Eduardo', nomeCurto: 'Carlos', cargo: 'Suporte', status: 'ativo' }
      ];
      equipeList = defaults.map(function(d, i){
        return {
          id: 'col_' + (Date.now() + i),
          nome: d.nome,
          nomeCurto: d.nomeCurto,
          cargo: d.cargo,
          whatsapp: '',
          email: '',
          notas: '',
          status: d.status,
          updatedAt: Date.now()
        };
      });
      await saveEquipeData();
    }
    renderEquipeList();
  }

  async function saveEquipeData(){
    try {
      if(!localMode) await fbSetEnc('colaboradores/' + emailKey + '/items', equipeList);
    } catch(e){}
  }

  window.setFilter = function(flt){
    activeFilter = flt;
    ['todos','ativo','inativo'].forEach(function(k){
      var el = $i('flt-' + k);
      if(el) el.classList.toggle('active', k === flt);
    });
    renderEquipeList();
  };

  window.setEqView = function(v){
    eqViewMode = (v==='list') ? 'list' : 'cards';
    try{ localStorage.setItem('eq_view', eqViewMode); }catch(e){}
    document.querySelectorAll('.view-toggle .vt').forEach(function(b){ b.classList.toggle('on', b.dataset.v===eqViewMode); });
    renderEquipeList();
  };

  window.renderEquipeList = function(){
    var q = ($i('eq-search').value || '').toLowerCase().trim();
    var container = $i('eq-grid-container');
    container.innerHTML = '';
    document.querySelectorAll('.view-toggle .vt').forEach(function(b){ b.classList.toggle('on', b.dataset.v===eqViewMode); });

    var cntTodos = equipeList.length;
    var cntAtivo = equipeList.filter(function(c){ return c.status !== 'inativo'; }).length;
    var cntInativo = equipeList.filter(function(c){ return c.status === 'inativo'; }).length;

    $i('cnt-todos').textContent = cntTodos;
    $i('cnt-ativo').textContent = cntAtivo;
    $i('cnt-inativo').textContent = cntInativo;

    var filtered = equipeList.filter(function(item){
      if(activeFilter === 'ativo' && item.status === 'inativo') return false;
      if(activeFilter === 'inativo' && item.status !== 'inativo') return false;

      if(!q) return true;
      var haystack = [item.nome, item.nomeCurto, item.cargo, item.whatsapp, item.email].join(' ');
      return figooMatchTerms(haystack, q);
    });

    if(filtered.length === 0){
      container.innerHTML = '<div style="grid-column:1/-1"><div class="figoo-empty-card"><div class="figoo-empty-icon">🔍</div><p class="figoo-empty-title">Nenhum colaborador encontrado</p><p class="figoo-empty-sub">Ajuste a busca ou o filtro de situação.</p></div></div>';
      return;
    }

    if(eqViewMode === 'list'){ renderEquipeTable(container, filtered); return; }

    filtered.forEach(function(col){
      var shortName = col.nomeCurto || col.nome.split(' ')[0] || col.nome;
      var waUrl = formatWaLink(col.whatsapp);
      var isAct = col.status !== 'inativo';
      var r = colabRollup(col);

      var card = document.createElement('div');
      card.className = 'eq-card';
      card.innerHTML =
        '<div class="eq-head">' +
          '<div class="eq-avatar">' + getInitials(col.nome) + '</div>' +
          '<div class="eq-info">' +
            '<div class="eq-name" title="' + esc(col.nome) + '">' + esc(col.nome) + '</div>' +
            '<div class="eq-short">📌 ' + esc(shortName) + ' <span style="font-weight:400;color:var(--text2);font-size:0.65rem">(usado na Weekly)</span></div>' +
            (col.cargo ? '<div class="eq-role">' + esc(col.cargo) + '</div>' : '') +
          '</div>' +
        '</div>' +

        '<div class="eq-details">' +
          (col.email ? '<div class="eq-row">✉️ ' + esc(col.email) + '</div>' : '') +
          (col.whatsapp ? '<div class="eq-row">📱 <b>' + esc(col.whatsapp) + '</b></div>' : '') +
          (col.notas ? '<div class="eq-row" style="white-space:nowrap;font-style:italic" title="'+esc(col.notas)+'">📝 ' + esc(col.notas) + '</div>' : '') +
        '</div>' +

        '<div class="eq-stats">' +
          '<span class="es">📋 <b>' + r.abertas + '</b> abertas' + (r.atrasadas ? ' <em class="es-crit">' + r.atrasadas + ' atrasada' + (r.atrasadas>1?'s':'') + '</em>' : '') + '</span>' +
          '<span class="es">⚡ <b>' + r.acoesAbertas + '</b> ações</span>' +
          '<span class="es">🤝 <b>' + r.reunioesN + '</b> reuniões</span>' +
          '<button type="button" class="tbtn" onclick="openColabFicha(\'' + esc(col.id) + '\')">Ver relacionados</button>' +
        '</div>' +

        '<div class="eq-foot">' +
          '<span class="st-tag ' + (isAct ? 'ativo' : 'inativo') + '">' + (isAct ? '✅ Ativo' : '⏸️ Inativo') + '</span>' +
          '<div style="display:flex;gap:6px;align-items:center">' +
            (waUrl ? '<a href="' + waUrl + '" target="_blank" class="wa-btn" title="Abrir conversa no WhatsApp" aria-label="Conversar no WhatsApp com ' + esc(col.nome) + '">💬</a>' : '') +
            '<button type="button" class="tbtn" aria-label="Editar ' + esc(col.nome) + '" onclick="editMember(\'' + esc(col.id) + '\')">Editar</button>' +
            '<button type="button" class="tbtn danger" style="color:var(--c-danger);border-color:color-mix(in srgb,var(--c-danger) 30%,var(--border))" aria-label="Excluir ' + esc(col.nome) + '" onclick="deleteMember(\'' + esc(col.id) + '\')">Excluir</button>' +
          '</div>' +
        '</div>';

      container.appendChild(card);
    });
  };

  function renderEquipeTable(container, filtered){
    if(eqTableSort.key){
      filtered = filtered.slice().sort(function(a, b){
        return figooCompareValues(eqSortValue(a, eqTableSort.key), eqSortValue(b, eqTableSort.key), eqTableSort.dir);
      });
    }
    var rows = filtered.map(function(col){
      var shortName = col.nomeCurto || col.nome.split(' ')[0] || col.nome;
      var waUrl = formatWaLink(col.whatsapp);
      var isAct = col.status !== 'inativo';
      return '<tr>' +
        '<td>' + esc(col.nome) + '</td>' +
        '<td>📌 ' + esc(shortName) + '</td>' +
        '<td>' + (col.cargo ? esc(col.cargo) : '<span style="color:var(--text2)">—</span>') + '</td>' +
        '<td>' + (waUrl ? '<a href="' + waUrl + '" target="_blank" class="wa-btn" title="Abrir no WhatsApp" aria-label="Conversar no WhatsApp com ' + esc(col.nome) + '">💬 ' + esc(col.whatsapp) + '</a>' : '<span style="color:var(--text2)">—</span>') + '</td>' +
        '<td><span class="st-tag ' + (isAct ? 'ativo' : 'inativo') + '">' + (isAct ? '✅ Ativo' : '⏸️ Inativo') + '</span></td>' +
        '<td style="text-align:right;white-space:nowrap">' +
          '<button type="button" class="tbtn" aria-label="Editar ' + esc(col.nome) + '" onclick="editMember(\'' + esc(col.id) + '\')">Editar</button> ' +
          '<button type="button" class="tbtn danger" style="color:var(--c-danger);border-color:color-mix(in srgb,var(--c-danger) 30%,var(--border))" aria-label="Excluir ' + esc(col.nome) + '" onclick="deleteMember(\'' + esc(col.id) + '\')">Excluir</button>' +
        '</td>' +
      '</tr>';
    }).join('');
    var thLabels = {nome:'Nome', nomeCurto:'Nome curto', cargo:'Cargo', whatsapp:'WhatsApp', status:'Status'};
    var thHtml = ['nome','nomeCurto','cargo','whatsapp','status'].map(function(key){
      return '<th class="th-sort" onclick="setEqSort(\''+key+'\')">'+thLabels[key]+figooSortArrow(eqTableSort, key)+'</th>';
    }).join('');
    container.innerHTML = '<div class="table-wrap"><table class="eq-table"><thead><tr>' +
      thHtml + '<th></th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  window.autoFillShortName = function(val){
    var shortInp = $i('member-short');
    if(!shortInp.value || shortInp.getAttribute('data-autofilled') === 'true'){
      var first = (val || '').trim().split(/\s+/)[0] || '';
      shortInp.value = first;
      shortInp.setAttribute('data-autofilled', 'true');
    }
  };

  window.openEquipeModal = function(){
    $i('modal-title').textContent = '👤 Cadastrar Integrante';
    $i('member-id').value = '';
    $i('member-nome').value = '';
    $i('member-short').value = '';
    $i('member-short').removeAttribute('data-autofilled');
    $i('member-cargo').value = '';
    $i('member-wa').value = '';
    $i('member-email').value = '';
    $i('member-status').value = 'ativo';
    $i('member-notas').value = '';
    $i('equipeModal').classList.remove('hidden');
  };

  window.closeEquipeModal = function(){
    $i('equipeModal').classList.add('hidden');
  };

  window.handleSaveMember = async function(e){
    e.preventDefault();
    var id = $i('member-id').value || ('col_' + Date.now());
    var nome = $i('member-nome').value.trim();
    var shortName = $i('member-short').value.trim() || nome.split(' ')[0];
    var cargo = $i('member-cargo').value.trim();
    var wa = $i('member-wa').value.trim();
    var email = $i('member-email').value.trim();
    var status = $i('member-status').value;
    var notas = $i('member-notas').value.trim();

    if(!nome) return;

    var idx = equipeList.findIndex(function(c){ return c.id === id; });
    var oldNome = idx >= 0 ? equipeList[idx].nome : null;
    var oldNomeCurto = idx >= 0 ? equipeList[idx].nomeCurto : null;
    var obj = {
      id: id,
      nome: nome,
      nomeCurto: shortName,
      cargo: cargo,
      whatsapp: wa,
      email: email,
      status: status,
      notas: notas,
      updatedAt: Date.now()
    };

    if(idx >= 0) equipeList[idx] = obj;
    else equipeList.push(obj);

    await saveEquipeData();
    renderEquipeList();
    closeEquipeModal();

    var norm = window.figooNormName || function(s){ return (s||'').trim().toLowerCase(); };
    var changed = 0;
    if (typeof figooCascadeRename === 'function') {
      if (oldNome && norm(oldNome) !== norm(nome)) changed += (await figooCascadeRename(emailKey, 'colaborador', oldNome, nome)).changed;
      if (oldNomeCurto && norm(oldNomeCurto) !== norm(shortName)) changed += (await figooCascadeRename(emailKey, 'colaborador', oldNomeCurto, shortName)).changed;
    }
    toast(changed > 0 ? ('✓ Integrante salvo — ' + changed + ' registro(s) relacionado(s) sincronizado(s)') : '✓ Integrante salvo com sucesso!');
  };

  window.editMember = function(id){
    var col = equipeList.find(function(c){ return c.id === id; });
    if(!col) return;
    $i('modal-title').textContent = '✏️ Editar Integrante';
    $i('member-id').value = col.id;
    $i('member-nome').value = col.nome;
    $i('member-short').value = col.nomeCurto || col.nome.split(' ')[0];
    $i('member-short').removeAttribute('data-autofilled');
    $i('member-cargo').value = col.cargo || '';
    $i('member-wa').value = col.whatsapp || '';
    $i('member-email').value = col.email || '';
    $i('member-status').value = col.status || 'ativo';
    $i('member-notas').value = col.notas || '';
    $i('equipeModal').classList.remove('hidden');
  };

  window.deleteMember = async function(id) {
    var col = equipeList.find(function(c){ return c.id === id; });
    if(!col) return;
    
    try {
      toast('Verificando histórico no banco...');
      var check = await figooCheckPersonInUse(emailKey, 'colaborador', [col.nome, col.nomeCurto]);

      if(check.used) {
        alert('❌ Este colaborador possui Pendências ou Reuniões vinculadas a ele.\\n\\nPara manter o histórico do banco de dados íntegro, a exclusão não é permitida. Se ele não faz mais parte da equipe, altere o status para INATIVO.');
        return;
      }

      if(confirm('Tem certeza que deseja excluir ' + col.nome + ' definitivamente?')) {
        equipeList = equipeList.filter(function(c){ return c.id !== id; });
        await saveEquipeData();
        renderEquipeList();
        toast('✓ Integrante excluído!');
      }
      
    } catch(e) {
      alert('Erro ao verificar relacionamentos. Tente novamente.');
    }
  };

  async function refreshEquipePage(){
    await loadRelatedData();
    await loadEquipeData();
  }

  async function init(){
    var p = new URLSearchParams(window.location.search);
    var eml = p.get('e') || localStorage.getItem('figoo_email') || '';
    if(!eml){ window.location.href = 'index.html'; return; }
    userEmail = eml; emailKey = emailToKey(eml);
    localStorage.setItem('figoo_email', eml);

    renderTopbar({
      module: 'Equipe', badge: FIG_ICON.users, badgeColor: 'var(--primary)', email: eml,
      onRefresh: refreshEquipePage,
      onLogout: function(){ authClearSession(emailKey); window.location.href = 'index.html'; }
    });

    if(!authHasSession(emailKey) || !(await dataKeyLoad(emailKey))){
      window.location.href = 'contas.html?e=' + encodeURIComponent(eml);
      return;
    }

    $i('topbar').style.display = 'flex';
    $i('pageWrap').style.display = 'flex';

    await loadRelatedData();
    await loadEquipeData();
  }

  init();
})();
</script>
</body>
</html>
